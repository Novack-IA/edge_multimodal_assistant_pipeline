name: CI

# Gate de PR normal (docs/11 §4): contratos + lint, sem GPU. PRs que tocam o
# laço quente (services/llm, services/tts, orchestrator, services/vision)
# também exigem rodar os benchmarks de latência num runner de device — isso
# não é feito aqui (GitHub-hosted runners não têm a Jetson Thor).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
