[project]
name = "edge-multimodal-assistant"
version = "0.1.0"
description = "Assistente de voz+visão multimodal on-device (Jetson AGX Thor) — LFM2.5-VL-3B via vLLM"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "httpx>=0.28",
    "numpy>=2.0",
    "pillow>=12.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Cada extra é instalado só quando formos rodar aquele serviço de verdade no
# device (doc 03/13) — mantém o core do orquestrador leve e testável sem GPU.
vad = ["onnxruntime>=1.18", "silero-vad>=5.1"]
stt = ["faster-whisper>=1.0"]
vision = ["opencv-python-headless>=4.9"]
# O pacote original `TTS` (coqui-ai/TTS) não é mais mantido e trava em
# Python <3.12. `coqui-tts` é o fork ativamente mantido (idiap), mesmo
# namespace de import (`TTS.*`) — ver services/tts/worker.py.
tts = ["coqui-tts[codec]>=0.27", "torch>=2.2", "transformers>=4.57,<5"]
orchestration = ["pipecat-ai>=0.0.50"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contracts*", "services*", "orchestrator*", "tools*"]
